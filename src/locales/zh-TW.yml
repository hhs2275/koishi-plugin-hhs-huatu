commands:
  novelai:
    description: AI 繪圖
    usage: |-
      輸入以逗號分割的英文提示詞，例如 Mr.Quin, dark sword, red eyes。
      查找可用的提示詞標籤可以使用 Danbooru。
      快來給專案標星收藏吧：https://github.com/hhs2275/koishi-plugin-hhs-huatu
      
      圖片審核功能現在支援群組過濾，可以在設定中設定只在特定群組開啟審核。

    shortcuts:
      imagine: 畫畫|約稿
      enhance: 增強

    options:
      enhance: 圖像增強模式
      model: 設定生成模型
      resolution: |-
        設定圖像尺寸
        portrait: 直圖 (832x1216)
        square: 方圖 (1024x1024)
        landscape: 橫圖 (1216x832)
      override: 禁用預設標籤
      sampler: 設定採樣器
      seed: 設定隨機種子
      steps: 設定迭代步數
      scale: 設定對輸入的服從度
      rescale: 輸入服從度調整規模（0-1）
      strength: 圖像修改幅度
      variety: 開啟Variety+
      noise: 圖像雜訊強度
      hiresFix: 啟用高解析度修復
      undesired: 排除標籤
      noTranslator: 禁用自動翻譯
      iterations: 設定繪製次數
      batch: 設定繪製批次大小
      chars: 設定角色提示詞，用引號將角色提示詞括起來，用分號 `;` 或 `；` 分隔角色。位置寫法：網格 `@B3`，或自由座標 `@0.35,0.62`（NAI 5 推薦，值域 0~1）
      inpaint: 啟用局部重繪模式
      smea: 啟用 SMEA
      smeaDyn: 啟用 DYN
      scheduler: 設定調度器
      decrisper: 啟用動態閾值
      charRef: 啟用角色參考功能（僅支援 v4.5 模型）
      charRefMode: 設定參考模式 (character, style, character&style，預設 character&style)
      charRefFidelity: 設定保真度 (0-1，預設 1)
      preciseRef: "精準參考：支援 nai4-5、nai4-5c，以及使用 NovelAI 官方權杖或登入後端的 nai5、nai5c。最多 6 張。V5 不可將 -P 與 -M 一起使用；請將 -P 和 -p 放在 -u 前面。"
      preciseRefParams: >-
        每張參考圖按傳送順序對應一組選填參數。用 ; 或 ； 分組，用 , 或 ， 分隔欄位。
        V4.5 用 模式,強度,保真度（強度和保真度均為 0–1，預設 cs,1,1）。
        V5 用 模式,強度（0–5），忽略舊寫法的第三欄。空白或省略的組別預設 sco,1，末尾分號可省略。
        V5 模式：sco 為角色與風格（偏好同款服裝），sc/cs 為角色與風格（不偏好同款服裝），co/oc 為角色（偏好同款服裝），
        c 為角色（不偏好同款服裝），s 僅參考風格，o 僅參考服裝。字母可任意排列但不可重複，so/os 無效。
    messages:
      queue-position: 目前佇列中有 {0} 個任務，你有 {1} 個任務正在處理
      queue-full: 目前等待任務已達到上限({0})，請稍後再試
      queue-busy: 目前繪圖併發已滿，請稍後再試
      exceed-user-queue: 你的任務數量已達到上限 ({0})，進入CD
      penalty-cooldown: 由於超出佇列上限，需要等待 {0} 秒後才能繼續使用
      redraw-queued: 已將 {0} 張重畫任務加入佇列 (總佇列：{1} | 你的佇列：{2})
      exceed-max-iteration: 超過最大繪製次數。
      expect-prompt: 請輸入標籤。
      expect-image: 請輸入圖像。
      too-many-images: 過多的圖像。
      invalid-content: 輸入中含有無效內容。
      latin-only: 只接受英文輸入。
      too-many-words: 輸入的單詞數量過多。
      forbidden-word: 輸入含有違禁詞。
      concurrent-jobs: 等會再約稿吧，我已經忙不過來了……
      waiting: 目前總佇列：{0} 個任務 | 你的佇列：{1} 個任務
      pending: 目前總佇列：{0} 個任務 | 你的佇列：{1} 個任務
      exceed-redraw-limit: 超出最大重畫數量限制 ({0})
      invalid-size: 增強功能僅適用於生成的圖像。普通的 img2img 請直接使用「約稿」而不是「增強」。
      invalid-resolution: 非法的圖像尺寸。寬高必須都為 64 的倍數。
      custom-resolution-unsupported: 不支援自訂圖像尺寸。
      file-too-large: 檔案體積過大。
      unsupported-file-type: 不支援的檔案格式
      download-error: 圖像下載失敗，連結可能已過期。
      unknown-error: 發生未知錯誤。
      image-review-failed: 圖像審核未通過，可能包含不適內容，請嘗試修改提示詞後重試。
      image-review-failed-muted: 圖像審核未通過，可能包含不適內容，你已被禁言{0}秒
      image-review-error: 圖像審核過程中出現錯誤，請稍後重試。
      response-error: 發生未知錯誤 ({0})。
      empty-response: 伺服器返回了空白圖像，請稍後重試。
      request-failed: 請求失敗 ({0})，請稍後重試。
      request-timeout: 請求逾時。
      invalid-password: 電子郵件或密碼錯誤。
      invalid-token: 令牌無效或已過期，請聯繫管理員。
      all-tokens-invalid: 所有令牌均無效或已過期，請聯繫管理員更新令牌。
      unauthorized: 令牌未授權，可能需要續費，請聯繫管理員。
      nai5-member-only: nai5 / nai5c 會消耗 NovelAI 配額，僅限會員使用。請充值會員，或切換到其他模型。
      nai5-overage-charged: 今日 nai5/nai5c 免費次數已用完，本次將按 Anlas 估算扣除點數。
      nai5-bucket-exhausted: nai5/nai5c 免費次數已用完，本次將按 Anlas 估算扣除點數。
      daily-limit-reached: 您今日的使用次數已達上限({0}次)，請充值會員或者明天再來。
      member-daily-limit-reached: 您今日的會員使用次數已達上限({0}次)，請明天再來。
      membership-expired: 您的會員已過期，已恢復為普通使用者權限。
      membership-active: 您目前是會員使用者，每日可使用{0}次，剩餘{1}次。
      tier-active: 您目前是 Lv{0} 會員，每日可使用{1}次，剩餘{2}次。
      tier-active-unlimited: 您目前是 Lv{0} 會員，可無限次使用。
      non-member-usage: 您目前是普通使用者，每日可使用{0}次，今日已使用{1}次，剩餘{2}次。
      cooldown: 繪圖CD中，請等待{0}秒後再試。
      size-exceeded: "圖片尺寸超過設定的最大像素限制（目前尺寸：{0}x{1}）。請使用 -r 指令縮小圖片，推薦使用 -r {2}x{3}。"
      inpaint-step1: 已將原圖調暗（目前尺寸：{0}x{1}{2}），請使用畫圖工具在需要重繪的區域塗上白色，然後在120秒內發送回來。
      inpaint-size-exceeded: "圖片尺寸超過設定的最大像素限制（目前尺寸：{0}x{1}）。請使用 -r 指令縮小圖片，推薦使用 -r {2}x{3}。"
      inpaint-cost-info: "，預計花費：{0}點數"
      inpaint-step2: 請發送塗好白色區域的圖像
      inpaint-timeout: 等待逾時，局部重繪已取消。
      inpaint-no-mask: 未偵測到圖像，局部重繪已取消。
      inpaint-error: 局部重繪處理失敗，請重試。
      inpaint-url-expired: 圖像連結已過期。
      inpaint-mask-download-failed: 蒙版圖下載失敗，請在60秒內重新發送塗白的蒙版圖。
      inpaint-image-download-failed: 參考圖下載失敗，請在60秒內重新發送需要局部重繪的原圖。
      inpaint-size-clamped: "原圖尺寸超過 NovelAI 最大限制，已自動縮小為 {0}x{1}。"
      charref-wait-image: 請在60秒內發送角色參考圖片。
      charref-processing: 正在處理角色參考圖片...
      charref-timeout: 等待逾時，角色參考已取消。
      charref-no-image: 未偵測到圖片，角色參考已取消。
      charref-error: 角色參考處理失敗，請重試。
      charref-model-unsupported: "目前模型不支援精準參考（包括 nai5m），請切換至 nai4-5、nai4-5c、nai5 或 nai5c。"
      preciseref-v5-backend: "V5 精準參考僅支援使用 NovelAI 官方權杖或登入後端。"
      preciseref-v5-inpaint: "V5 無法同時使用精準參考（-P）和局部重繪（-M），請移除其中一個選項。"
      preciseref-v5-params: "-p 參數無效。請依圖片順序填寫，每張圖一組「模式,強度」，例如「sc,2;o,1」。可用 sco、sc/cs、co/oc、s、c、o（字母順序不限），強度 0–5，預設 sco,1。"
      preciseref-v5-extra-params: "-p 的參數組數多於參考圖張數。請重新傳送指令，減少參數組或補足參考圖。"
      preciseref-v5-redraw-image: "V5 參考圖連結已過期或無法存取。請重新傳送含 -P 的指令並上傳參考圖。"
      preciseref-wait-image: 請在60秒內發送精準參考圖片。您可以發送"start"結束收集，發送"取消"取消任務，最多6張。
      points-insufficient: 您的點數不足（目前 {0} 點，需要 {1} 點），無法執行此任務。
      points-deducted: ，預扣除 {0} 點數
      points-refunded: ，已返還 {0} 點數  
  novelai.reset-queue:
    description: 重置使用者佇列狀態
    usage: 重置指定使用者的佇列計數和CD
    options:
      user: 目標使用者ID
    messages:
      default: 已重置使用者 {0} 的佇列狀態
      invalid-user: 無效的使用者ID
      permission-denied: 權限不足

  novelai.queue:
    description: 查詢NAI繪圖佇列狀態
    usage: 查看目前佇列中的任務數量和你的任務數量

  novelai.upscale:
    description: AI 放大圖像

    shortcuts:
      upscale: 放大

    options:
      scale: 設定放大倍數
      resolution: 設定放大尺寸
      crop: 是否裁剪以適應尺寸
      upscaler: 設定放大模型
      upscaler2: 設定放大模型 2
      upscaler2visibility: 設定放大模型 2 的可見度
      upscaleFirst: 先放大再執行面部修復

    messages:
      expect-image: 請輸入圖像。
      download-error: 圖像解析失敗。
      unknown-error: 發生未知錯誤。
      image-review-failed: 圖像審核未通過，可能包含不適內容，請嘗試修改提示詞後重試。
      image-review-error: 圖像審核過程中出現錯誤，請稍後重試。

  novelai.redraw:
    description: 重畫
    usage: |-
      修改novelai-bot外掛程式新增的<redraw>標籤，再次執行命令，可以重畫上一次的圖像。
      
  novelai.member:
    description: 會員系統
    usage: |-
      查詢或設定會員狀態，管理員可以設定其他使用者的會員狀態。
      範例：
      會員  查詢自己的會員狀態
      會員 -u QQ號 （查詢指定QQ號使用者的會員狀態）
      會員 -d 30 （自己設定30天會員）
      會員 -u QQ號 -d 30 （指定QQ號使用者設定30天會員）
      會員 -c （取消自己的會員資格）
      會員 -u QQ號 -c （取消指定QQ號使用者的會員資格）
      會員 -l （查詢會員列表）
      會員 -l -p 2 （查詢會員列表，第2頁）
      會員 -l -s 20 （查詢會員列表，每頁20條，按會員等級排序）
    options:
      user: 目標用戶ID
      days: 增加或設置的會員天数
      tier: 會員等級（Lv1-Lv5），與 -d 同時使用；缺省為 1
      addPoints: 增加或減少的用戶點數（支援負數）
      refreshPoints: 刷新用戶的點數
      cancel: 取消會員資格
      list: 列出所有未過期的有效會員
      page: 指定會員列表的頁碼
      size: 指定會員列表每頁顯示的條數
    messages:
      queue-position: 目前總佇列：{0} 個任務 | 你的佇列：{1} 個任務
      queue-full: 目前等待任務已達到上限({0}),請稍後再試
      exceed-user-queue: 你的任務數量已達到上限 ({0})，進入CD
      penalty-cooldown: 由於超出佇列上限，需要等待 {0} 秒後才能繼續使用
      redraw-queued: 已將 {0} 張重畫任務加入佇列 (總佇列：{1} | 你的佇列：{2})
      exceed-max-iteration: 超過最大繪製次數。
      expect-prompt: 請輸入標籤。
      expect-image: 請輸入圖像。
      too-many-images: 過多的圖像。
